      - key: AGENT_PAY_REGISTRY_ARC_MAINNET
        value: "0x2c126Af5F25e02B11DaB8aeD74A27340e018D9F0"
      # Secrets — Dashboard only. Omission does not delete existing values.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CIRCLE_API_KEY_TESTNET
        sync: false
      - key: CIRCLE_API_KEY_MAINNET
        sync: false
      - key: CIRCLE_API_KEY
        sync: false
      - key: SELLER_PRIVATE_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
